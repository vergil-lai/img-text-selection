name: Publish img-text-selection to npm

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install publishing tools
              run: npm install --global npm@11 pnpm@12.0.0

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Verify tag matches package version
              run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

            - name: Verify package identity
              run: test "$(node -p "require('./package.json').name")" = "img-text-selection"

            - name: Build package
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Publish package
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --access public